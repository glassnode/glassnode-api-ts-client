name: Docs
# Build the TypeDoc API reference and deploy it to GitHub Pages
# (https://glassnode.github.io/glassnode-api-ts-client/). One-time repo setting:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deployment finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
        env:
          # The standalone pnpm (@pnpm/exe) needs its preinstall (setup.js picks the platform
          # binary) or the pnpm bin is a stub that fails with "This: not found". The action
          # installs it with `npm ci` in its own directory and lockfile, where the repo .npmrc
          # (ignore-scripts=true) is probably not read; this step-level override makes sure
          # scripts run for that bootstrap whatever npm config applies. It is scoped to this
          # step: the project installs below still honor the repo .npmrc.
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: api-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
