name: CI
on:
  # PRs into main, and into long-lived release branches (e.g. release/1.0, where a major's
  # breaking changes land as separate PRs before one final PR merges it into main).
  pull_request:
    branches: [main, 'release/**']
  # publish.yml calls this workflow as its `verify` job, so a release runs exactly the PR checks.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs for the same PR (github.ref is refs/pull/<n>/merge, unique per PR whatever
# its base branch, so PRs into main and into release/** never share a group). When publish.yml
# calls this workflow the group is the caller's run (never shared) and nothing is cancelled, so one
# release's checks can never cancel another's.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
        env:
          # The repo .npmrc sets ignore-scripts=true (supply-chain hardening), but the
          # standalone pnpm (@pnpm/exe) needs its preinstall (setup.js picks the platform
          # binary) or the pnpm bin is a stub that fails with "This: not found". Re-enable
          # scripts for this bootstrap only; the project installs below still honor .npmrc.
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Enforce the coverage thresholds (vitest.config.ts), not just that tests pass.
      - run: pnpm run test:coverage
      # Type-check the test files (Vitest transpiles without type checking).
      - run: pnpm exec tsc -p tsconfig.test.json --noEmit
      # Type-check the examples/ scripts against src/ so they can't drift from the public API
      # (they are only run ad hoc via ts-node). Resolves deps from the root install — no extra
      # install of the examples/ sub-project.
      - run: pnpm exec tsc -p tsconfig.examples.json
      # Install the examples/ sub-project from its own lockfile, as examples/README.md documents.
      # `npm ci` fails if examples/package-lock.json is out of sync with examples/package.json, so
      # the lockfile cannot go stale silently. Registry only; examples/.npmrc sets ignore-scripts.
      - working-directory: examples
        run: npm ci --no-audit --no-fund
      # The type-check above can't catch runtime module resolution: src/ uses `.js` relative
      # specifiers, which ts-node only maps to `.ts` via examples/tsconfig.json
      # (experimentalResolver). Import both entries the way `npx ts-node ex.<name>.ts` does, with
      # the ts-node the examples install locks. Offline: no example code runs, no API call.
      - working-directory: examples
        run: >-
          npx --no-install ts-node -e "import { GlassnodeAPI } from '../src';
          import { createX402Fetch } from '../src/x402';
          if (typeof GlassnodeAPI !== 'function' || typeof createX402Fetch !== 'function')
          throw new Error('unexpected exports');
          console.log('examples: ts-node resolves ../src')"
      - run: pnpm run build
      - run: pnpm run build:browser
      # Build the TypeDoc API reference (typedoc.json: treatWarningsAsErrors), so a broken {@link},
      # a doc comment referencing an unexported type or a bad README path fails the PR.
      - run: pnpm run docs
      # Deep type-resolution guard that attw can't provide (it runs with skipLibCheck on): a
      # node16 consumer importing `glassnode-api/x402` with skipLibCheck:false. Catches a public
      # `.d.ts` accidentally re-importing an optional peer's types (e.g. viem → TS1541).
      - run: pnpm exec tsc -p typecheck/x402-node16/tsconfig.json
      # Packaging audits (hard gates): the export map, types resolution and module formats must
      # stay correct across node10/node16/bundler. publint fails on errors; attw fails on any 💀/🎭/🚭.
      - run: pnpm dlx publint
      - run: pnpm dlx @arethetypeswrong/cli --pack .

  # Prove the package's advertised floor (engines: ">=18"). Vitest 5 needs Node >=22.12, so this
  # job does not run the suite — it builds, smoke-imports the CJS entry and runs a plain-Node
  # runtime smoke (a real AbortSignal.timeout() abort -> GlassnodeNetworkError timedOut) on Node 18.
  compat-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
        env:
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node -e "const m = require('./dist/index.js'); if (typeof m.GlassnodeAPI !== 'function') throw new Error('CJS entry did not export GlassnodeAPI'); console.log('CJS require smoke ok on', process.version);"
      - run: node scripts/smoke-timeout.mjs
